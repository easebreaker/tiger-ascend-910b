[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiger-ascend"
version = "0.1.0"
description = "TIGER generative retrieval adaptation workspace for Ascend 910B"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1.0",
  "transformers>=4.38.0,<5.0.0",
  "numpy>=1.23",
  "tqdm>=4.65",
  "sentencepiece>=0.1.99",
  "protobuf>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["tiger_ascend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
